name: Just One Xiaohongshu Benchmark

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Benchmark mode"
        required: true
        default: final-verdict
        type: choice
        options:
          - final-verdict
          - free-smoke

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      JUSTONE_API_TOKEN: ${{ secrets.JUSTONE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate secret exists
        run: |
          if [ -z "$JUSTONE_API_TOKEN" ]; then
            echo "Missing repository secret: JUSTONE_API_TOKEN"
            exit 2
          fi

      - name: FINAL V4 freshness verdict (1 request only)
        if: ${{ inputs.mode == 'final-verdict' }}
        run: |
          python backend/benchmarks/justone_smoke.py \
            --keyword "小程序" \
            --output-dir backend/benchmarks/output

      - name: Free cached cross-platform smoke test (1 request)
        if: ${{ inputs.mode == 'free-smoke' }}
        run: |
          python backend/benchmarks/justone_cross_search_smoke.py \
            --keyword "找人做小程序" \
            --hours 24 \
            --output-dir backend/benchmarks/output

      - name: Upload benchmark report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: justone-xiaohongshu-benchmark-${{ github.run_id }}
          path: backend/benchmarks/output/
          if-no-files-found: warn
          retention-days: 7
