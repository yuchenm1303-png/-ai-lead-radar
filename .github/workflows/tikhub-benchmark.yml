name: TikHub Xiaohongshu Benchmark

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Benchmark size"
        required: true
        default: quick
        type: choice
        options:
          - quick
          - full

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TIKHUB_API_KEY: ${{ secrets.TIKHUB_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate secret exists
        run: |
          if [ -z "$TIKHUB_API_KEY" ]; then
            echo "Missing repository secret: TIKHUB_API_KEY"
            exit 2
          fi

      - name: Check TikHub account and key status
        continue-on-error: true
        run: |
          python backend/benchmarks/tikhub_account_status.py \
            --output-dir backend/benchmarks/output

      - name: Run quick benchmark (5 requests)
        if: ${{ inputs.mode == 'quick' }}
        run: |
          python backend/benchmarks/source_benchmark.py \
            --provider tikhub \
            --keyword "寻找开发团队" \
            --keyword "AI智能体 开发团队" \
            --keyword "找人做小程序" \
            --keyword "找人做网站" \
            --keyword "网站开发 有偿" \
            --output-dir backend/benchmarks/output

      - name: Run full benchmark (20 requests)
        if: ${{ inputs.mode == 'full' }}
        run: |
          python backend/benchmarks/source_benchmark.py \
            --provider tikhub \
            --output-dir backend/benchmarks/output

      - name: Assert at least one API request succeeded
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          reports = sorted(Path('backend/benchmarks/output').glob('source-benchmark-*.json'))
          if not reports:
              raise SystemExit('No benchmark report was produced.')
          report = json.loads(reports[-1].read_text(encoding='utf-8'))
          rows = report.get('results', [])
          successful = sum(1 for row in rows if row.get('ok'))
          print(f'Successful API requests: {successful}/{len(rows)}')
          if successful == 0:
              raise SystemExit('All TikHub benchmark requests failed. See report artifact for details.')
          PY

      - name: Upload benchmark report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tikhub-xiaohongshu-benchmark-${{ github.run_id }}
          path: backend/benchmarks/output/
          if-no-files-found: warn
          retention-days: 7
