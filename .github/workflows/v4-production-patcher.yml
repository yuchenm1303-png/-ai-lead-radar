name: V4 Production Patcher

on:
  push:
    branches:
      - feat/retrieval-v4-conversation-production

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/retrieval-v4-conversation-production
          fetch-depth: 0
      - name: Apply source patch
        run: python scripts/v4_production_patch.py
      - name: Commit generated source changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat(retrieval): wire V4 conversation acquisition [v4-patched]"
          git push origin HEAD:feat/retrieval-v4-conversation-production
